version: '3'
services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant-test-project
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT_ALLOW_CORS=true
    networks:
      - agi_network

networks:
  agi_network:
    driver: bridge
